<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  $1  
  <meta name="screen-orientation" content="landscape">
  <meta name="x5-orientation" content="landscape">
<title>爱心漂浮贴纸 ✨</title>
  <style>
    :root{
      /* —— 可调参数 —— */
      --max-windows: 140;           /* 贴纸数量（建议 80~200） */
      --window-w: 220px;            /* 贴纸宽度 */
      --window-h: 56px;             /* 贴纸高度 */

      --born-show-time: 800;        /* ms：初始随机静止展示时长 */
      --to-heart-time: 1200;        /* ms：飞向爱心时长 */
      --stay-on-heart: 1000;        /* ms：在爱心停留时长 */
      --scatter-time: 1200;         /* ms：从爱心散开时长 */
      --step-ms: 16;                /* 帧间隔近似，用于节流 */

      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
    }

    html,body{
      margin:0; height:100%; overflow:hidden; background:#fffafc; color:#333;
      font-family: var(--font-family);
    }
    .stage{
      position:fixed; inset:0; overflow:hidden; touch-action:none;
      background: radial-gradient(1000px 500px at 50% 20%, rgba(255,192,203,.15), transparent 60%) ,
                  linear-gradient(180deg, #fffafc, #fff 40%);
    }

    .note{
      position:absolute; width:var(--window-w); height:var(--window-h);
      display:flex; align-items:center; justify-content:center;
      padding:8px 10px; box-sizing:border-box;
      border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,.08);
      font-weight:600; font-size:14px; text-align:center; user-select:none;
      will-change: transform; transform:translate3d(0,0,0);
    }

    .hud{
      position:fixed; left:12px; bottom:12px; z-index:9999;
      display:flex; gap:8px; flex-wrap:wrap;
    }
    .hud button{
      padding:8px 12px; border-radius:10px; border:1px solid #eee; background:#fff;
      box-shadow:0 2px 10px rgba(0,0,0,.06); cursor:pointer; font-weight:600;
    }
    .hud .badge{ padding:8px 12px; border-radius:999px; background:#000; color:#fff; opacity:.08; font-weight:700; }

    @media (max-width: 480px){
      :root{ --window-w: 180px; --window-h: 52px; }
      .hud{ left:8px; bottom:8px; }
      .hud button{ padding:8px 10px; }
    }
  
    /* —— 竖屏提示：请旋转至横屏 —— */
    @media screen and (orientation:portrait) {
      body::before {
        content: "请旋转手机至横屏以查看完整动画 💖";
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        font-size: 18px;
        color: #d33;
        z-index: 999999;
        text-align: center;
        padding: 24px;
        line-height: 1.6;
      }
      /* 当竖屏时隐藏舞台，避免在提示后面仍在渲染、耗电 */
      .stage { visibility: hidden; }
    }
  $1
</head>
<body>
  <div class="stage" id="stage"></div>
  <div class="hud" role="toolbar" aria-label="controls">
    <button id="restart">重新开始</button>
    <button id="toggle">暂停</button>
    <span class="badge">❤</span>
  </div>

  <script>
    // —— 可调内容 ——
    const TIPS = [
      "多喝水哦~","保持微笑呀","照顾好自己","每天都要开开心心的哦",
      "我想你了","期待见面","保持好心情哦","记得想我","别熬夜啦","早点休息",
      "梦想成真","天天开心","天冷了多穿衣服","愿所有烦恼都消失"
    ];
    const BG_COLORS = ['lightgreen','lightyellow','skyblue','plum','bisque','mistyrose','oldlace','lavender','lavenderblush'];

    // —— 工具函数 ——
    const easeOutCubic = t => { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); };
    const easeInOutSine = t => { t = Math.max(0, Math.min(1, t)); return -(Math.cos(Math.PI * t) - 1) / 2; };

    function heartPoints(n, cx, cy, scale){
      const pts = [];
      for(let i=0;i<n;i++){
        const t = (i / n) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const px = cx + x * scale;
        const py = cy - y * scale;
        pts.push([px, py]);
      }
      return pts;
    }

    function clamp(x, min, max){ return Math.max(min, Math.min(max, x)); }
    function lerp(a, b, t){ return [ a[0] + (b[0]-a[0]) * t, a[1] + (b[1]-a[1]) * t ]; }

    // —— 主逻辑 ——
    (function(){
      const stage = document.getElementById('stage');
      const W = () => stage.clientWidth;
      const H = () => stage.clientHeight;

      let MAX = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--max-windows')) || 140;
      let BORN = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--born-show-time')) || 800;
      let TOHEART = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--to-heart-time')) || 1200;
      let STAY = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--stay-on-heart')) || 1000;
      let SCATTER = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--scatter-time')) || 1200;
      let STEP = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--step-ms')) || 16;

      const state = { items: [], running: true, lastTick: performance.now() };

      function makeItem(i){
        const el = document.createElement('div');
        el.className = 'note';
        el.textContent = TIPS[(Math.random()*TIPS.length)|0];
        el.style.background = BG_COLORS[(Math.random()*BG_COLORS.length)|0];
        stage.appendChild(el);

        const w = parseFloat(getComputedStyle(el).width);
        const h = parseFloat(getComputedStyle(el).height);

        const minX = 0, maxX = Math.max(0, W() - w);
        const minY = 0, maxY = Math.max(0, H() - h);

        const sx = (Math.random() * (maxX - minX)) + minX;
        const sy = (Math.random() * (maxY - minY)) + minY;

        // 心形中心与缩放
        const cx = (W() - w) / 2;
        const cy = (H() - h) / 2;
        const scale = Math.min(W(), H()) / 40;
        const heart = heartPts[i];

        // 轻微抖动延迟
        const jitter = (Math.random() * 150)|0;
        const now = performance.now();

        return {
          el,
          start:[sx, sy],
          heart:[ clamp(heart[0], minX, maxX), clamp(heart[1], minY, maxY) ],
          scatter:null,
          phase:'born',
          phaseStart: now + jitter,
          w, h,
        };
      }

      function setPos(el, x, y){
        el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      }

      function layoutAll(){
        // 重新计算心形点（在窗口尺寸变更时）
        const cx = (W() - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--window-w'))) / 2;
        const cy = (H() - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--window-h'))) / 2;
        const scale = Math.min(W(), H()) / 40;
        heartPts = heartPoints(MAX, cx, cy, scale);
        state.items.forEach((it, i)=>{
          const minX = 0, maxX = Math.max(0, W() - it.w);
          const minY = 0, maxY = Math.max(0, H() - it.h);
          const p = heartPts[i];
          it.heart = [ clamp(p[0], minX, maxX), clamp(p[1], minY, maxY) ];
        });
      }

      // 初始化
      let heartPts = [];
      (function init(){
        layoutAll();
        // 先只放入 DOM，再给首帧位置
        for(let i=0;i<MAX;i++){
          state.items.push(makeItem(i));
        }
        state.items.forEach(it=> setPos(it.el, it.start[0], it.start[1]));
      })();

      // 动画主循环
      function tick(now){
        if(now - state.lastTick < STEP){
          requestAnimationFrame(tick); return;
        }
        state.lastTick = now;
        if(state.running){
          let active = false;
          for(const it of state.items){
            const phase = it.phase;
            if(phase === 'done') continue;
            active = true;
            if(phase === 'born'){
              if(now - it.phaseStart >= BORN){
                it.phase = 'to_heart'; it.phaseStart = now;
              }
              continue;
            }
            if(phase === 'to_heart'){
              const t = (now - it.phaseStart) / TOHEART;
              const p = lerp(it.start, it.heart, easeOutCubic(t));
              setPos(it.el, p[0], p[1]);
              if(t >= 1){ it.phase = 'stay'; it.phaseStart = now; }
              continue;
            }
            if(phase === 'stay'){
              if(now - it.phaseStart >= STAY){
                const minX = 0, maxX = Math.max(0, W() - it.w);
                const minY = 0, maxY = Math.max(0, H() - it.h);
                it.scatter = [ (Math.random()*(maxX-0))+0, (Math.random()*(maxY-0))+0 ];
                it.phase = 'scatter'; it.phaseStart = now;
              }
              continue;
            }
            if(phase === 'scatter'){
              const t = (now - it.phaseStart) / SCATTER;
              const p = lerp(it.heart, it.scatter, easeInOutSine(t));
              setPos(it.el, p[0], p[1]);
              if(t >= 1){ it.phase = 'done'; }
              continue;
            }
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      // 交互
      const btnToggle = document.getElementById('toggle');
      const btnRestart = document.getElementById('restart');
      btnToggle.addEventListener('click', ()=>{
        state.running = !state.running;
        btnToggle.textContent = state.running ? '暂停' : '继续';
      });
      btnRestart.addEventListener('click', ()=>{
        // 清空并重来
        state.items.forEach(it=> it.el.remove());
        state.items = [];
        layoutAll();
        for(let i=0;i<MAX;i++) state.items.push(makeItem(i));
        state.items.forEach(it=> setPos(it.el, it.start[0], it.start[1]));
      });

      // 窗口尺寸变化时重算心形点
      let resizeTimer = 0;
      window.addEventListener('resize', ()=>{
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(()=>{
          layoutAll();
        }, 120);
      }, {passive:true});

      // 防止 iOS 橡皮筋回弹
      document.addEventListener('touchmove', (e)=>{ e.preventDefault(); }, {passive:false});
    })();
  </script>
</body>
</html>
